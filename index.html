<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oyun Odası Platformu</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0f111a; color: #fff; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .box { background: #1a1d29; width: 100%; max-width: 950px; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; font-size: 16px; }
        input, select { background: #262a3b; color: #fff; border: 1px solid #3d435e; outline: none; }
        button { background: #00adb5; color: white; font-weight: bold; cursor: pointer; }
        .btn-menu { background: #262a3b; border: 1px solid #3d435e; margin: 8px 0; font-size: 17px; }
        .btn-back { background: #444; margin-top: 15px; }

        /* HAZIR LİSTESİ */
        .ready-panel { background: #202433; border: 1px solid #3d435e; border-radius: 8px; padding: 12px; margin: 15px 0; text-align: left; }
        .ready-badge { display: inline-block; padding: 5px 10px; margin: 4px; border-radius: 6px; font-size: 13px; font-weight: bold; background: #262a3b; border: 1px solid #444; }
        .is-ready { color: #2ecc71; border-color: #2ecc71; }
        .not-ready { color: #e74c3c; border-color: #e74c3c; }

        /* 🧠 İŞKEMBEDEN SALLAMA ÖZEL STİLLERİ */
        .guess-card {
            background: #202433; border: 2px solid #9b59b6; border-radius: 14px; padding: 16px;
            margin: 15px auto; max-width: 520px; box-shadow: 0 8px 25px rgba(155, 89, 182, 0.25);
        }
        .guess-img-holder {
            width: 100%; height: 260px; border-radius: 10px; overflow: hidden; margin-bottom: 12px; background: #111;
        }
        .guess-img-holder img { width: 100%; height: 100%; object-fit: cover; }
        .guess-timer-bar {
            width: 100%; height: 8px; background: #333; border-radius: 4px; overflow: hidden; margin-bottom: 10px;
        }
        .guess-timer-fill {
            height: 100%; background: #e74c3c; width: 100%; transition: width 1s linear
